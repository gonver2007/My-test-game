<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mazmorra</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div id="escena">
  <canvas id="vista" width="960" height="600"></canvas>
  <div id="hud">
    <div>
      <span id="estadoPv"></span>
      <div class="barra"><div id="vida"></div></div>
      <div class="barra exp"><div id="exp"></div></div>
      <div class="barra dash"><div id="dash"></div></div>
    </div>
    <div id="estadoNivel"></div>
  </div>
  <canvas id="minimapa"></canvas>
  <div id="mensajes"></div>
  <div id="aviso"></div>
  <div id="muerte">HAS MUERTO<small>Pulsa R para empezar de nuevo</small></div>
</div>

<div class="ayuda">
  <b>WASD</b> moverte · <b>Shift</b> correr · <b>ratón</b> apuntar ·
  <b>clic izq</b> atacar · <b>clic der</b> cubrirse · <b>espacio</b> impulso ·
  <b>E</b> cruzar la puerta · <b>R</b> reiniciar
</div>

<script src="mazmorra.js"></script>
<script src="vista.js"></script>
</body>
</html>
