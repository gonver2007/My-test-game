<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sendas del Santuario</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#160d1c;overflow:hidden;}
  /* el marco es la pantalla entera: el armazón no se ve, solo sujeta */
  #marco{display:block;width:100vw;height:100vh;border:0;}
</style>
</head>
<body>

<!-- Esta página no se recarga nunca mientras se anda por el menú: las
     pantallas van pasando aquí dentro. Es lo que permite que la caja de
     música de abajo siga sonando sin cortes de una a otra, en vez de nacer
     y morir con cada una. El porqué y el reparto, en js/armazon.js. -->
<iframe id="marco" title="Sendas del Santuario"></iframe>

<audio id="musicaFondo" data-canal="musica" src="musica/main-theme.mp3" loop preload="auto"></audio>

<script src="js/ajustes.js"></script>
<script src="js/armazon.js"></script>
</body>
</html>
