<!DOCTYPE html> 
<html lang="es">
<head>

<body class="menu" data-siguiente="game.html" data-anterior="ranura.html">

<canvas id="fondoMenu"></canvas>

    <nav id="botones">

        <button id="btPersonaje" class="boton">PERSONAJE</button>
        <button id="btVolver" class="boton">VOLVER</button>

    <!-- los rellenan armeria.js y personaje.js al abrirlos, para que el saldo
         mostrado sea siempre el del momento -->

    <div id="personaje" class="panel armeria" hidden></div>
</div>

<script src="../js/armeria.js"></script>
