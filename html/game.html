<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sendas del Santuario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="juego">

<div id="escena">
    <canvas id="vista"></canvas>
    <div id="hud">
        <div>
            <span id="estadoPv"></span>
            <div class="barra"><div id="vida"></div></div>
            <div class="barra dash"><div id="dash"></div></div>
        </div>
        <div id="estadoNivel"></div>
    </div>
    <canvas id="minimapa"></canvas>

    <!-- los saldos van en el rincón que dejó el registro de mensajes;
         los iconos los pone vista.js, que los comparte con los paneles -->
    <div id="monedas">
        <div id="jade"><span id="jadeIcono"></span><span id="jadeCifra">0</span></div>
        <div id="lapis"><span id="lapisIcono"></span><span id="lapisCifra">0</span></div>
    </div>
    <div id="aviso"></div>
    <!-- al caer no se reinicia solo: el jugador elige si vuelve a prepararse
         o se marcha al inicio -->
    <div id="muerte">
        <span class="titulo">HAS CAÍDO</span>
        <!-- lo lleva vista.js al caer; sin botín que llorar, ni aparece -->
        <div id="muertePerdido" class="perdido" hidden></div>
        <div class="opciones">
            <button id="mtContinuar" class="boton principal">CONTINUAR</button>
            <button id="mtSalir" class="boton">SALIR</button>
        </div>
    </div>

    <!-- Esc lo abre y lo cierra; mientras tanto la partida sigue corriendo -->
    <div id="menuJuego" hidden>
        <button id="mjCerrar" class="boton principal">SEGUIR JUGANDO</button>
        <button id="mjAjustes" class="boton">AJUSTES</button>
        <!-- solo se enseña en las ranuras con «cheat on»; lo destapa consola.js -->
        <button id="mjInicio" class="boton">VOLVER AL INICIO</button>
        <button id="mjSalir" class="boton">CERRAR EL JUEGO</button>
        <p id="mjNota" hidden>El navegador no deja cerrar esta pestaña: ciérrala tú.</p>
    </div>

    <!-- Los ajustes no son una pantalla aparte: se asoman aquí encima, en su
         propia ventana, y por el borde se sigue viendo la senda. La página es
         la misma ajustes.html que abre la portada, cargada dentro la primera
         vez que se pide; ella sola se da cuenta de que va enmarcada. -->
    <div id="ventanaAjustes" hidden>
        <iframe id="marcoAjustes" title="Ajustes" src="about:blank"></iframe>
    </div>

    <!-- el mismo mueble de la portada. Aquí Alt+Intro y el botón del menú solo
         lo abren si la ranura trae encendido el permiso -->
    <div id="consola" hidden>
        <div class="salida"></div>
        <div class="entrada">
            <span class="signo">›</span>
            <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="orden">
        </div>
    </div>
</div>

<script src="../js/armeria.js"></script>
<script src="../js/personaje.js"></script>
<script src="../js/partidas.js"></script>
<script src="../js/ajustes.js"></script>
<!-- las comarcas se declaran antes que nada: la mazmorra y la vista las leen -->
<script src="../js/biomas.js"></script>
<script src="../js/mazmorra.js"></script>
<!-- antes que la vista: así su Esc se atiende primero y cierra la consola
     sin abrir además el menú -->
<script src="../js/consola.js"></script>
<script src="../js/vista.js"></script>
</body>
</html>
