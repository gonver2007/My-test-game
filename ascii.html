<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mazmorra (ASCII)</title>
<style>
  body {
    background: #101014;
    color: #c8c8d0;
    font-family: Consolas, "Courier New", monospace;
    display: flex; flex-direction: column; align-items: center;
    margin: 20px;
  }
  #mapa { font-size: 16px; line-height: 1.0; letter-spacing: 2px; white-space: pre; margin: 10px 0; }
  #estado { margin-bottom: 6px; }
  #log { width: 620px; height: 90px; overflow-y: auto; white-space: pre-wrap;
         font-size: 13px; color: #8a8a96; border-top: 1px solid #2a2a34; padding-top: 6px; }
  .ayuda { font-size: 12px; color: #55555f; margin-top: 8px; }
</style>
</head>
<body>

<div id="estado"></div>
<div id="mapa"></div>
<div id="log"></div>
<div class="ayuda">
  Flechas o WASD para moverte · te mueves contra un enemigo para atacarlo ·
  &gt; bajar escaleras · R reiniciar · <a href="index.html" style="color:#6a6a80">versión 3D</a>
</div>

<script src="mazmorra-turnos.js"></script>
<script>
// Vista de texto: misma partida, otro dibujado.
const CH = { rata: 'r', trol: 'T', pocion: '!' };

function dibujar() {
  const buffer = J.mapa.map(fila => fila.slice());
  buffer[J.escalera.y][J.escalera.x] = '>';
  for (const o of J.objetos) buffer[o.y][o.x] = CH[o.tipo];
  for (const e of J.enemigos) buffer[e.y][e.x] = CH[e.tipo];
  buffer[J.jugador.y][J.jugador.x] = J.muerto ? '%' : '@';

  document.getElementById('mapa').textContent = buffer.map(f => f.join('')).join('\n');
  document.getElementById('estado').textContent =
    `PV ${J.jugador.hp}/${J.jugador.hpMax}   Nivel pj ${J.jugador.nivel}   ` +
    `Exp ${J.jugador.exp}/${J.jugador.nivel * 20}   Mazmorra ${J.nivel}`;

  const divLog = document.getElementById('log');
  divLog.textContent = J.log.slice(-8).join('\n');
  divLog.scrollTop = divLog.scrollHeight;
}

document.addEventListener('keydown', ev => {
  const k = ev.key;
  if (k === 'r' || k === 'R') { iniciarPartida(); dibujar(); return; }
  if (k === '>' || k === '.') { bajar(); dibujar(); return; }

  const dirs = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
  };
  if (dirs[k]) {
    ev.preventDefault();
    intentarMover(dirs[k][0], dirs[k][1]);
    dibujar();
  }
});

iniciarPartida();
dibujar();
</script>
</body>
</html>
