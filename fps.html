<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mazmorra 3D</title>
<style>
  html, body {
    background: #08080b;
    color: #b8b8c4;
    font-family: Consolas, "Courier New", monospace;
    margin: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #escena {
    position: relative;
    width: 960px;
    height: 600px;
    box-shadow: 0 0 40px #000;
  }
  canvas#vista {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    background: #000;
  }
  /* --- capas superpuestas sobre la vista 3D --- */
  #hud {
    position: absolute; left: 0; top: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 8px 12px;
    font-size: 14px;
    text-shadow: 0 0 4px #000, 0 1px 2px #000;
    pointer-events: none;
  }
  #barraVida {
    width: 160px; height: 10px;
    border: 1px solid #6a2a2a; background: #200;
    margin-top: 4px;
  }
  #barraVida > div { height: 100%; background: #b03030; }
  #mini {
    position: absolute; right: 10px; bottom: 10px;
    image-rendering: pixelated;
    opacity: 0.85;
    border: 1px solid #2a2a34;
  }
  #mensajes {
    position: absolute; left: 12px; bottom: 10px;
    font-size: 13px; line-height: 1.5;
    color: #9a9aa8;
    text-shadow: 0 0 4px #000, 0 1px 2px #000;
    pointer-events: none;
    max-width: 60%;
  }
  #mensajes div:last-child { color: #e0e0ea; }
  #muerte {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    background: rgba(60, 0, 0, 0.55);
    color: #f0d0d0;
    font-size: 30px;
    letter-spacing: 3px;
  }
  #muerte small { font-size: 14px; letter-spacing: 1px; margin-top: 10px; color: #c09090; }
  .ayuda { font-size: 12px; color: #55555f; margin-top: 10px; }
  .ayuda b { color: #7a7a88; font-weight: normal; }
</style>
</head>
<body>

<div id="escena">
  <canvas id="vista" width="480" height="300"></canvas>
  <div id="hud">
    <div>
      <span id="estadoPv"></span>
      <div id="barraVida"><div></div></div>
    </div>
    <div id="estadoNivel" style="text-align:right"></div>
  </div>
  <canvas id="mini" width="144" height="120"></canvas>
  <div id="mensajes"></div>
  <div id="muerte">HAS MUERTO<small>Pulsa R para empezar de nuevo</small></div>
</div>

<div class="ayuda">
  <b>W/�?'</b> avanzar · <b>S/�?"</b> retroceder · <b>A/D o �?�/�?'</b> girar · <b>Q/E</b> paso lateral ·
  <b>Espacio</b> bajar escaleras · <b>R</b> reiniciar
</div>

<script src="mazmorra-turnos.js"></script>
<script>
// ============================================================
//  Renderizador 3D por raycasting (sin librerías)
// ============================================================
const lienzo = document.getElementById('vista');
const ctx = lienzo.getContext('2d');
const AN = lienzo.width, AL = lienzo.height;
const imagen = ctx.createImageData(AN, AL);
const pix = imagen.data;
const zbuffer = new Float32Array(AN);

const FOV = 0.75;          // ~74 grados
const ALCANCE_LUZ = 9;     // a partir de aquí, oscuridad total

// ---------- Cámara ----------
// La lógica del juego es por casillas; la cámara solo interpola entre ellas.
const cam = { x: 0, y: 0, ang: 0 };
let orientacion = 0;       // 0=este 1=sur 2=oeste 3=norte
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];

let anim = null;           // animación en curso (bloquea la entrada)
let flash = 0;             // destello rojo al recibir daño
let hpPrevio = 0;

// ============================================================
//  Texturas: se dibujan por código en un canvas oculto
// ============================================================
const TEX = 64;

function lienzoOculto(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function aTextura(canvas) {
  const d = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
  return { w: canvas.width, h: canvas.height, data: d.data };
}

// Muro de sillería: bloques con juntas y grano irregular
function texturaMuro() {
  const c = lienzoOculto(TEX, TEX);
  const g = c.getContext('2d');
  g.fillStyle = '#3a3630';
  g.fillRect(0, 0, TEX, TEX);

  const altoBloque = 16, anchoBloque = 32;
  for (let fila = 0; fila < TEX / altoBloque; fila++) {
    const desfase = (fila % 2) * (anchoBloque / 2);
    for (let bx = -anchoBloque; bx < TEX; bx += anchoBloque) {
      const tono = 92 + azar(-14, 14);
      g.fillStyle = `rgb(${tono}, ${tono - 8}, ${tono - 20})`;
      g.fillRect(bx + desfase + 1, fila * altoBloque + 1, anchoBloque - 2, altoBloque - 2);
    }
  }
  // grano
  const d = g.getImageData(0, 0, TEX, TEX);
  for (let i = 0; i < d.data.length; i += 4) {
    const n = azar(-16, 16);
    d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n;
  }
  g.putImageData(d, 0, 0);

  // alguna mancha de humedad
  for (let i = 0; i < 6; i++) {
    g.fillStyle = 'rgba(30, 40, 30, 0.25)';
    g.beginPath();
    g.arc(azar(0, TEX), azar(0, TEX), azar(3, 9), 0, Math.PI * 2);
    g.fill();
  }
  return aTextura(c);
}

// Sprites de 32x48 con transparencia
function nuevoSprite(pintar) {
  const c = lienzoOculto(32, 48);
  const g = c.getContext('2d');
  pintar(g);
  return aTextura(c);
}

const spriteRata = () => nuevoSprite(g => {
  g.fillStyle = '#6b6259';                       // cuerpo
  g.beginPath(); g.ellipse(16, 38, 11, 7, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(24, 34, 6, 5, 0, 0, Math.PI * 2); g.fill();   // cabeza
  g.fillStyle = '#4a423b';                       // orejas
  g.beginPath(); g.arc(23, 29, 3, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#7d7268'; g.lineWidth = 2;    // cola
  g.beginPath(); g.moveTo(6, 39); g.quadraticCurveTo(0, 34, 3, 28); g.stroke();
  g.fillStyle = '#d04040';                       // ojo
  g.fillRect(26, 33, 2, 2);
});

const spriteTrol = () => nuevoSprite(g => {
  g.fillStyle = '#4f6b3c';                       // torso
  g.fillRect(9, 18, 14, 22);
  g.beginPath(); g.arc(16, 14, 8, 0, Math.PI * 2); g.fill();  // cabeza
  g.fillRect(4, 20, 5, 16);                      // brazos
  g.fillRect(23, 20, 5, 16);
  g.fillStyle = '#3d5330';                       // piernas
  g.fillRect(10, 40, 5, 8);
  g.fillRect(17, 40, 5, 8);
  g.fillStyle = '#e0c040';                       // ojos
  g.fillRect(12, 12, 3, 3);
  g.fillRect(18, 12, 3, 3);
  g.fillStyle = '#e8e8d8';                       // colmillos
  g.fillRect(13, 19, 2, 3);
  g.fillRect(18, 19, 2, 3);
});

const spritePocion = () => nuevoSprite(g => {
  g.fillStyle = '#8fa8b8';                       // cuello
  g.fillRect(14, 30, 4, 5);
  g.fillStyle = 'rgba(200, 60, 60, 0.9)';        // líquido
  g.beginPath(); g.ellipse(16, 41, 7, 6, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(220, 220, 240, 0.5)';    // reflejo del vidrio
  g.lineWidth = 1;
  g.beginPath(); g.ellipse(16, 41, 7, 6, 0, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#c8a060';                       // corcho
  g.fillRect(13, 27, 6, 3);
});

const spriteEscalera = () => nuevoSprite(g => {
  g.fillStyle = '#141118';                       // hueco oscuro
  g.fillRect(4, 26, 24, 22);
  for (let i = 0; i < 4; i++) {                  // peldaños que bajan
    const t = 70 - i * 14;
    g.fillStyle = `rgb(${t},${t},${t + 6})`;
    g.fillRect(4 + i * 3, 44 - i * 5, 24 - i * 6, 3);
  }
});

let texMuro, sprites;

function prepararGraficos() {
  texMuro = texturaMuro();
  sprites = {
    rata: spriteRata(),
    trol: spriteTrol(),
    pocion: spritePocion(),
    escalera: spriteEscalera()
  };
  cargarTexturasPropias();
}

// Si existe assets/muro.png (y la página se sirve por http), se usa esa imagen.
// Con file:// el navegador bloquea la lectura de píxeles y se mantiene la procedural.
function cargarTexturasPropias() {
  const img = new Image();
  img.onload = () => {
    try {
      const c = lienzoOculto(TEX, TEX);
      c.getContext('2d').drawImage(img, 0, 0, TEX, TEX);
      texMuro = aTextura(c);
    } catch (e) {
      console.warn('assets/muro.png encontrado pero no legible (file://). Usa un servidor local.');
    }
  };
  img.src = 'assets/muro.png';
}

// ============================================================
//  Dibujado de la vista
// ============================================================
function fondo() {
  const horizonte = AL >> 1;
  for (let y = 0; y < AL; y++) {
    let r, g, b;
    if (y < horizonte) {                                  // techo
      const t = y / horizonte;                            // 0 arriba, 1 horizonte
      r = 10 + t * 12; g = 10 + t * 12; b = 14 + t * 16;
    } else {                                              // suelo
      const t = (y - horizonte) / horizonte;              // 0 horizonte, 1 abajo
      r = 12 + t * 46; g = 11 + t * 40; b = 9 + t * 30;
    }
    let i = y * AN * 4;
    for (let x = 0; x < AN; x++, i += 4) {
      pix[i] = r; pix[i + 1] = g; pix[i + 2] = b; pix[i + 3] = 255;
    }
  }
}

function paredes() {
  const dirX = Math.cos(cam.ang), dirY = Math.sin(cam.ang);
  const planoX = -dirY * FOV, planoY = dirX * FOV;

  for (let x = 0; x < AN; x++) {
    const camX = 2 * x / AN - 1;
    const rayoX = dirX + planoX * camX;
    const rayoY = dirY + planoY * camX;

    let mapX = Math.floor(cam.x), mapY = Math.floor(cam.y);
    const deltaX = Math.abs(1 / rayoX), deltaY = Math.abs(1 / rayoY);

    let pasoX, pasoY, ladoDistX, ladoDistY;
    if (rayoX < 0) { pasoX = -1; ladoDistX = (cam.x - mapX) * deltaX; }
    else           { pasoX =  1; ladoDistX = (mapX + 1 - cam.x) * deltaX; }
    if (rayoY < 0) { pasoY = -1; ladoDistY = (cam.y - mapY) * deltaY; }
    else           { pasoY =  1; ladoDistY = (mapY + 1 - cam.y) * deltaY; }

    // DDA: avanzar casilla a casilla hasta chocar
    let lado = 0, golpe = false, vueltas = 0;
    while (!golpe && vueltas++ < 64) {
      if (ladoDistX < ladoDistY) { ladoDistX += deltaX; mapX += pasoX; lado = 0; }
      else                       { ladoDistY += deltaY; mapY += pasoY; lado = 1; }
      if (esMuro(mapX, mapY)) golpe = true;
    }

    const dist = lado === 0
      ? (mapX - cam.x + (1 - pasoX) / 2) / rayoX
      : (mapY - cam.y + (1 - pasoY) / 2) / rayoY;
    zbuffer[x] = dist;
    if (!golpe || dist <= 0) continue;

    const alto = Math.floor(AL / dist);
    let ini = Math.floor(-alto / 2 + AL / 2);
    let fin = Math.floor(alto / 2 + AL / 2);
    const iniRec = Math.max(ini, 0), finRec = Math.min(fin, AL - 1);

    // coordenada horizontal de la textura, según dónde impactó el rayo
    let muroX = lado === 0 ? cam.y + dist * rayoY : cam.x + dist * rayoX;
    muroX -= Math.floor(muroX);
    let texX = Math.floor(muroX * TEX);
    if ((lado === 0 && rayoX > 0) || (lado === 1 && rayoY < 0)) texX = TEX - texX - 1;

    // las caras norte/sur algo más oscuras: da volumen sin calcular luces
    const luz = Math.max(0, 1 - dist / ALCANCE_LUZ) * (lado === 1 ? 0.72 : 1);
    const paso = TEX / alto;
    let texPos = (iniRec - AL / 2 + alto / 2) * paso;

    for (let y = iniRec; y <= finRec; y++) {
      const texY = Math.min(TEX - 1, texPos | 0);
      texPos += paso;
      const s = (texY * TEX + texX) * 4;
      const d = (y * AN + x) * 4;
      pix[d]     = texMuro.data[s] * luz;
      pix[d + 1] = texMuro.data[s + 1] * luz;
      pix[d + 2] = texMuro.data[s + 2] * luz;
    }
  }
}

function dibujarSprites() {
  const lista = [];
  if (!(J.escalera.x === J.jugador.x && J.escalera.y === J.jugador.y))
    lista.push({ x: J.escalera.x, y: J.escalera.y, tex: sprites.escalera, escala: 1 });
  for (const o of J.objetos)
    lista.push({ x: o.x, y: o.y, tex: sprites.pocion, escala: 1 });
  for (const e of J.enemigos)
    lista.push({ x: e.x, y: e.y, tex: sprites[e.tipo], escala: e.tipo === 'trol' ? 1.15 : 0.8 });

  const dirX = Math.cos(cam.ang), dirY = Math.sin(cam.ang);
  const planoX = -dirY * FOV, planoY = dirX * FOV;

  // de lejos a cerca, para que los cercanos tapen a los lejanos
  for (const s of lista) {
    s.d = (s.x + 0.5 - cam.x) ** 2 + (s.y + 0.5 - cam.y) ** 2;
  }
  lista.sort((a, b) => b.d - a.d);

  const invDet = 1 / (planoX * dirY - dirX * planoY);

  for (const s of lista) {
    const relX = s.x + 0.5 - cam.x;
    const relY = s.y + 0.5 - cam.y;
    const transX = invDet * (dirY * relX - dirX * relY);
    const transY = invDet * (-planoY * relX + planoX * relY);   // profundidad
    if (transY <= 0.15) continue;

    const pantallaX = Math.floor((AN / 2) * (1 + transX / transY));
    const alto = Math.floor(Math.abs(AL / transY) * s.escala);
    const ancho = Math.floor(alto * (s.tex.w / s.tex.h));

    // apoyados en el suelo, no centrados en el horizonte
    const desplome = Math.floor((AL / transY) * (1 - s.escala) / 2);
    const iniY = Math.max(0, Math.floor(AL / 2 - alto / 2) + desplome);
    const finY = Math.min(AL - 1, Math.floor(AL / 2 + alto / 2) + desplome);
    const iniX = Math.max(0, Math.floor(pantallaX - ancho / 2));
    const finX = Math.min(AN - 1, Math.floor(pantallaX + ancho / 2));

    const luz = Math.max(0.05, 1 - transY / ALCANCE_LUZ);

    for (let x = iniX; x <= finX; x++) {
      if (transY >= zbuffer[x]) continue;                       // tapado por un muro
      const texX = Math.floor((x - (pantallaX - ancho / 2)) * s.tex.w / ancho);
      if (texX < 0 || texX >= s.tex.w) continue;

      for (let y = iniY; y <= finY; y++) {
        const texY = Math.floor((y - (AL / 2 - alto / 2 + desplome)) * s.tex.h / alto);
        if (texY < 0 || texY >= s.tex.h) continue;
        const o = (texY * s.tex.w + texX) * 4;
        const a = s.tex.data[o + 3];
        if (a < 20) continue;
        const d = (y * AN + x) * 4;
        const m = (a / 255) * luz;
        pix[d]     = pix[d]     * (1 - m) + s.tex.data[o]     * m;
        pix[d + 1] = pix[d + 1] * (1 - m) + s.tex.data[o + 1] * m;
        pix[d + 2] = pix[d + 2] * (1 - m) + s.tex.data[o + 2] * m;
      }
    }
  }
}

function tinteDanio() {
  if (flash <= 0) return;
  const k = flash * 0.5;
  for (let i = 0; i < pix.length; i += 4) {
    pix[i] = pix[i] * (1 - k) + 170 * k;
    pix[i + 1] *= (1 - k * 0.8);
    pix[i + 2] *= (1 - k * 0.8);
  }
}

function pintarEscena() {
  fondo();
  paredes();
  dibujarSprites();
  tinteDanio();
  ctx.putImageData(imagen, 0, 0);
}

// ============================================================
//  Minimapa, HUD y mensajes
// ============================================================
const mini = document.getElementById('mini');
const mctx = mini.getContext('2d');
const CELDA = 3;

function pintarMini() {
  mctx.fillStyle = '#0b0b0f';
  mctx.fillRect(0, 0, mini.width, mini.height);

  // ventana centrada en el jugador
  const cols = Math.floor(mini.width / CELDA), filas = Math.floor(mini.height / CELDA);
  const ox = Math.round(J.jugador.x - cols / 2), oy = Math.round(J.jugador.y - filas / 2);

  for (let fy = 0; fy < filas; fy++) {
    for (let fx = 0; fx < cols; fx++) {
      const mx = ox + fx, my = oy + fy;
      if (mx < 0 || my < 0 || mx >= ANCHO || my >= ALTO) continue;
      if (J.mapa[my][mx] !== '.') continue;
      mctx.fillStyle = '#2c2c38';
      mctx.fillRect(fx * CELDA, fy * CELDA, CELDA, CELDA);
    }
  }
  const punto = (x, y, color) => {
    mctx.fillStyle = color;
    mctx.fillRect((x - ox) * CELDA, (y - oy) * CELDA, CELDA, CELDA);
  };
  punto(J.escalera.x, J.escalera.y, '#d0c060');
  for (const o of J.objetos) punto(o.x, o.y, '#c04040');
  for (const e of J.enemigos) punto(e.x, e.y, e.tipo === 'trol' ? '#60b040' : '#a09080');
  punto(J.jugador.x, J.jugador.y, '#ffffff');
}

function pintarHud() {
  const p = J.jugador;
  document.getElementById('estadoPv').textContent = `PV ${p.hp}/${p.hpMax}`;
  document.querySelector('#barraVida > div').style.width =
    Math.max(0, (p.hp / p.hpMax) * 100) + '%';
  document.getElementById('estadoNivel').textContent =
    `Mazmorra ${J.nivel}   ·   Nivel ${p.nivel}   ·   Exp ${p.exp}/${p.nivel * 20}` +
    (sobreEscalera() ? '\n[Espacio] bajar escaleras' : '');
  document.getElementById('mensajes').innerHTML =
    J.log.slice(-5).map(t => `<div>${t}</div>`).join('');
  document.getElementById('muerte').style.display = J.muerto ? 'flex' : 'none';
}

// ============================================================
//  Turnos, animación y entrada
// ============================================================
function ejecutar(dx, dy) {
  const antesX = J.jugador.x, antesY = J.jugador.y;
  hpPrevio = J.jugador.hp;

  if (!intentarMover(dx, dy)) return;    // muro: ni turno ni animación

  if (J.jugador.x === antesX && J.jugador.y === antesY) {
    // no avanzó: fue un ataque -> embestida corta
    anim = { tipo: 'golpe', t: 0, dur: 180, dx, dy, x: antesX, y: antesY };
  } else {
    anim = { tipo: 'mover', t: 0, dur: 150, x0: antesX, y0: antesY,
             x1: J.jugador.x, y1: J.jugador.y };
  }
  if (J.jugador.hp < hpPrevio) flash = 1;
}

function girar(sentido) {
  const desde = orientacion;
  orientacion = (orientacion + sentido + 4) % 4;
  anim = { tipo: 'girar', t: 0, dur: 130, a0: desde * Math.PI / 2, a1: desde * Math.PI / 2 + sentido * Math.PI / 2 };
}

function avanzarAnimacion(dt) {
  if (flash > 0) flash = Math.max(0, flash - dt / 350);

  if (!anim) {
    cam.x = J.jugador.x + 0.5;
    cam.y = J.jugador.y + 0.5;
    cam.ang = orientacion * Math.PI / 2;
    return;
  }

  anim.t += dt;
  const t = Math.min(1, anim.t / anim.dur);
  const suave = t * t * (3 - 2 * t);          // suavizado

  if (anim.tipo === 'mover') {
    cam.x = (anim.x0 + (anim.x1 - anim.x0) * suave) + 0.5;
    cam.y = (anim.y0 + (anim.y1 - anim.y0) * suave) + 0.5;
  } else if (anim.tipo === 'girar') {
    cam.ang = anim.a0 + (anim.a1 - anim.a0) * suave;
  } else if (anim.tipo === 'golpe') {
    const empuje = Math.sin(suave * Math.PI) * 0.28;
    cam.x = anim.x + 0.5 + anim.dx * empuje;
    cam.y = anim.y + 0.5 + anim.dy * empuje;
  }

  if (t >= 1) anim = null;
}

let ultimo = performance.now();
function bucle(ahora) {
  const dt = Math.min(50, ahora - ultimo);
  ultimo = ahora;
  avanzarAnimacion(dt);
  pintarEscena();
  pintarMini();
  pintarHud();
  requestAnimationFrame(bucle);
}

document.addEventListener('keydown', ev => {
  const k = ev.key;
  if (k === 'r' || k === 'R') { comenzar(); return; }
  if (anim) return;                            // esperando a que acabe el paso

  const [dx, dy] = DIRS[orientacion];
  const [px, py] = DIRS[(orientacion + 1) % 4];   // perpendicular (derecha)

  switch (k) {
    case 'ArrowUp': case 'w': case 'W':    ejecutar(dx, dy); break;
    case 'ArrowDown': case 's': case 'S':  ejecutar(-dx, -dy); break;
    case 'ArrowLeft': case 'a': case 'A':  girar(-1); break;
    case 'ArrowRight': case 'd': case 'D': girar(1); break;
    case 'q': case 'Q':                    ejecutar(-px, -py); break;
    case 'e': case 'E':                    ejecutar(px, py); break;
    case ' ': case '>':                    bajar(); break;
    default: return;
  }
  ev.preventDefault();
});

function comenzar() {
  iniciarPartida();
  orientacion = 0;
  anim = null;
  flash = 0;
  cam.x = J.jugador.x + 0.5;
  cam.y = J.jugador.y + 0.5;
  cam.ang = 0;
}

prepararGraficos();
comenzar();
requestAnimationFrame(bucle);
</script>
</body>
</html>
